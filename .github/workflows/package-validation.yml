name: Package validation

on:
  pull_request:
    paths:
      - .apm/**
      - .github/workflows/package-validation.yml
      - apm.yml
      - docs/adr/**
      - DISTRIBUTION.md
      - README.md
      - tests/**
      - tools/Invoke-RuntimeMatrixProbe.ps1
      - tools/Test-PackageBoundary.ps1
  push:
    branches:
      - main
    paths:
      - .apm/**
      - .github/workflows/package-validation.yml
      - apm.yml
      - docs/adr/**
      - DISTRIBUTION.md
      - README.md
      - tests/**
      - tools/Invoke-RuntimeMatrixProbe.ps1
      - tools/Test-PackageBoundary.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-dispatch-probe:
    name: Runtime and dispatch probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture runtime and dispatch facts
        shell: pwsh
        run: ./tools/Invoke-RuntimeMatrixProbe.ps1 -OutputPath artifacts/runtime-probe.json

      - name: Run offline release-gating contracts
        shell: pwsh
        run: ./tests/Invoke-ContractTests.ps1

      - name: Upload runtime probe
        uses: actions/upload-artifact@v4
        with:
          name: runtime-probe-${{ matrix.os }}
          path: artifacts/runtime-probe.json

  validate-package:
    name: Validate authoritative package and plugin bundle
    runs-on: ubuntu-latest
    env:
      APM_VERSION: 0.26.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned APM CLI
        shell: bash
        run: curl -sSL https://aka.ms/apm-unix | sh -s -- "@v${APM_VERSION}"

      - name: Verify APM CLI version
        shell: bash
        run: apm --version 2>&1 | tee /dev/stderr | grep -Fq "version ${APM_VERSION}"

      - name: Validate package boundary
        shell: pwsh
        run: ./tools/Test-PackageBoundary.ps1

      - name: Run offline release-gating contracts
        shell: pwsh
        run: ./tests/Invoke-ContractTests.ps1