name: Package validation

on:
  pull_request:
    paths:
      - .apm/**
      - .github/workflows/package-validation.yml
      - apm.yml
      - DISTRIBUTION.md
      - README.md
      - tools/Test-PackageBoundary.ps1
  push:
    branches:
      - main
    paths:
      - .apm/**
      - .github/workflows/package-validation.yml
      - apm.yml
      - DISTRIBUTION.md
      - README.md
      - tools/Test-PackageBoundary.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    name: Validate authoritative package and plugin bundle
    runs-on: ubuntu-latest
    env:
      APM_VERSION: 0.26.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned APM CLI
        shell: bash
        run: curl -sSL https://aka.ms/apm-unix | sh -s -- "@v${APM_VERSION}"

      - name: Verify APM CLI version
        shell: bash
        run: test "$(apm --version)" = "Agent Package Manager (APM) CLI version ${APM_VERSION}"

      - name: Validate package boundary
        shell: pwsh
        run: ./tools/Test-PackageBoundary.ps1